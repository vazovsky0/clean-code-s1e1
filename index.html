<!DOCTYPE html>
<html>
  <head>
    <title>Eisenhower Matrix Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8" />
  </head>
  <body>
    <main class="app-container">
      <section class="matrix__container">
        <h1>Eisenhower Matrix Todo</h1>
        <img src="./eisenhower-matrix.jpg" /><a
          class="matrix__container-link"
          href="https://goal-life.com/page/method/matrix-eisenhower"
          >Want more details?</a
        >
      </section>

      <section class="todo__container">
        <h3>
          <label for="todo__container-new--task">Add Item</label>
        </h3>
        <div class="todo__container-btn">
          <input
            id="todo__container-new--task"
            class="task"
            type="text"
          /><button>Add</button>
        </div>
        <h3 class="todo__container-header">Todo</h3>
        <ul id="todo__container-incomplete--tasks">
          <li>
            <input type="checkbox" /><label class="task">Pay Bills</label
            ><input type="text" class="task" /><button class="edit">Edit</button
            ><button class="delete"><img src="./remove.svg" /></button>
          </li>
          <li class="todo__container-edit--mode">
            <input type="checkbox" /><label class="task">Go Shopping</label
            ><input type="text" value="Go Shopping" class="task" /><button
              class="edit"
            >
              Save</button
            ><button class="delete"><img src="./remove.svg" /></button>
          </li>
        </ul>
        <h3 class="todo__container-header">Completed</h3>
        <ul id="todo__container-complete--tasks">
          <li>
            <input type="checkbox" checked /><label class="task"
              >See the Doctor</label
            ><input type="text" class="task" /><button class="edit">Edit</button
            ><button class="delete"><img src="./remove.svg" /></button>
          </li>
        </ul>
      </section>
    </main>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
